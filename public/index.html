<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Courtside Library</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn only-mobile" id="filtersToggle" aria-label="Filters">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 5h18M6 12h12M10 19h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </button>
    <a class="brand" href="#">
      <img src="favicon.svg" alt="" width="28" height="28">
      <span>Courtside</span>
    </a>
    <div class="stats" id="stats"></div>
    <div class="top-actions">
      <button class="icon-btn top" id="quickFetch" title="Fetch new games" aria-label="Fetch new games">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.6-4.5M4 4v4h4M4 13a8 8 0 0 0 14.6 4.5M20 20v-4h-4"/></svg>
      </button>
      <button class="icon-btn top" id="settingsBtn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="search">
        <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="Search games, teams…" autocomplete="off">
      </div>

      <div class="group">
        <h3>League</h3>
        <div class="pills" id="leagues"></div>
      </div>

      <div class="group two">
        <label><h3>Season</h3><select id="season"></select></label>
        <label><h3>Stage</h3><select id="phase"></select></label>
      </div>

      <div class="group">
        <h3>Team</h3>
        <div id="teamSelected" class="team-selected" hidden></div>
        <input id="teamSearch" class="team-search" type="search" placeholder="Filter teams…" autocomplete="off">
        <ul class="team-list" id="teams"></ul>
      </div>

      <div class="group">
        <h3>Library</h3>
        <label class="check"><input type="checkbox" id="newOnly"> <span>New only</span> <span class="n" id="newCount"></span></label>
        <label class="check"><input type="checkbox" id="fav"> <span>Favorites only</span></label>
        <label class="check"><input type="checkbox" id="torrent"> <span>Has a .torrent (not Mega-only)</span></label>
        <select id="dl">
          <option value="">Downloaded or not</option>
          <option value="0">Not downloaded yet</option>
          <option value="1">Downloaded</option>
        </select>
      </div>

      <button class="btn ghost wide" id="reset">Reset filters</button>
    </aside>

    <main class="main">
      <div class="results-head">
        <div>
          <h1 id="heading">All games</h1>
          <p class="sub" id="subheading"></p>
        </div>
        <select id="sort" aria-label="Sort">
          <option value="date_desc">Newest first</option>
          <option value="date_asc">Oldest first</option>
          <option value="added_desc">Recently added</option>
        </select>
      </div>
      <div class="new-banner" id="newBanner" hidden></div>
      <div id="results"></div>
      <div id="sentinel"></div>
      <div class="empty" id="empty" hidden></div>
    </main>
  </div>
  <div class="scrim" id="scrim" hidden></div>

  <div class="toast" id="toast" hidden></div>

  <div class="modal" id="settings" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <header class="modal-head">
        <h2 id="settingsTitle">Settings</h2>
        <button class="icon-btn big" id="settingsClose" aria-label="Close settings">✕</button>
      </header>
      <div class="modal-main">
        <nav class="modal-nav" id="settingsNav">
          <button data-section="fetch" class="on">Fetch</button>
          <button data-section="storage">Storage</button>
          <button data-section="updates" id="navUpdates" hidden>Updates</button>
        </nav>
        <div class="modal-body" id="settingsBody"></div>
      </div>
      <div class="modal-confirm" id="settingsConfirm" hidden></div>
      <footer class="modal-foot">
        <span class="foot-note" id="settingsNote"></span>
        <button class="btn" id="fetchNow">Fetch now</button>
        <button class="btn primary" id="saveSettings" disabled>Save</button>
      </footer>
    </div>
  </div>

  <div class="player" id="player" hidden>
   <div class="player-box" id="pBox">
    <div class="player-top">
      <div class="player-title">
        <span class="badge" id="pBadge"></span>
        <strong id="pTitle"></strong>
      </div>
      <div class="player-pickers">
        <select id="pRelease" title="Source" hidden></select>
        <select id="pPart" title="Part" hidden></select>
      </div>
      <div class="player-actions">
        <button class="btn" id="pCopy" title="Original file with 5.1 audio, for VLC / IINA (File → Open Network)">Copy URL for VLC</button>
        <button class="icon-btn big" id="pClose" aria-label="Close player (Esc)">✕</button>
      </div>
    </div>

    <div class="stage" id="pStage">
      <video id="pVideo" playsinline preload="auto"></video>
      <div class="stage-msg" id="pMsg"><span class="spinner"></span><span id="pMsgText">Connecting to peers…</span></div>
      <button class="big-play" id="pBigPlay" hidden aria-label="Play">▶</button>
      <div class="resume" id="pResume" hidden></div>
    </div>

    <div class="player-bottom">
    <div class="controls" id="pControls">
      <button class="ctl" id="pPlay" aria-label="Play/pause (Space)">▶</button>
      <button class="ctl small" id="pBack" aria-label="Back 10 seconds">↺ 10</button>
      <button class="ctl small" id="pFwd" aria-label="Forward 30 seconds">30 ↻</button>
      <span class="time" id="pTime">0:00 / --:--</span>
      <div class="timeline" id="pTimeline">
        <canvas id="pPieces" height="4"></canvas>
        <div class="tl-track"><div class="tl-played" id="pPlayed"></div></div>
        <div class="tl-head" id="pHead"></div>
        <div class="tl-hover" id="pHover" hidden></div>
      </div>
      <button class="ctl" id="pMute" aria-label="Mute (M)">🔊</button>
      <input class="vol" id="pVol" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
      <button class="ctl" id="pFull" aria-label="Fullscreen (F)">⛶</button>
    </div>
    <div class="player-stats" id="pStats"></div>
    </div>
   </div>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
